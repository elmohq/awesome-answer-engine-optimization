name: awesome-lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint the list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # awesome-lint requires real git history to check repository age.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run awesome-lint
        run: npx --yes awesome-lint
